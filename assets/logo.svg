<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A7E90"/>
      <stop offset="100%" stop-color="#033D4E"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DDFEA"/>
      <stop offset="100%" stop-color="#12B3C4"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b1"/>
      <feOffset in="b1" dx="0" dy="8" result="o1"/>
      <feComponentTransfer in="o1" result="s1"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="b2"/>
      <feOffset in="b2" dx="0" dy="24" result="o2"/>
      <feComponentTransfer in="o2" result="s2"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode in="s2"/><feMergeNode in="s1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pure white rounded container -->
  <rect width="1024" height="1024" rx="224" fill="#FFFFFF"/>

  <!-- Back card (deep teal, rotated 9°, offset right) -->
  <g filter="url(#sh)" transform="translate(556 514) rotate(9)">
    <rect x="-210" y="-280" width="420" height="560" rx="38" fill="url(#back)"/>
  </g>

  <!-- Front card (cyan gradient) -->
  <g filter="url(#sh)" transform="translate(470 520)">
    <rect x="-210" y="-280" width="420" height="560" rx="38" fill="url(#front)"/>
    <rect x="-208" y="-278" width="416" height="556" rx="36"
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Big bold white S + caption marker -->
  <g transform="translate(470 520)">
    <text x="0" y="-30"
          font-family="SF Pro Rounded, -apple-system, Arial Rounded MT Bold, Helvetica, sans-serif"
          font-weight="900" font-size="440"
          text-anchor="middle" dominant-baseline="central"
          fill="#FFFFFF">S</text>
    <rect x="34" y="218" width="120" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
    <rect x="34" y="244" width="66" height="10" rx="5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>
